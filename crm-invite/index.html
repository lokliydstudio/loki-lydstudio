<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Loki Studio · CRM-invitasjon</title>
  <style>
    :root{color-scheme:dark;--bg:#111714;--panel:#18201c;--line:#334038;--text:#f2f4f1;--muted:#a5aea9;--accent:#9dc6ba;--accent-dark:#14251f}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}main{width:min(470px,100%);padding:36px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}.brand{display:flex;align-items:center;gap:13px;margin-bottom:38px}.brand img{width:52px;height:52px;object-fit:contain;filter:brightness(0) invert(1)}.brand span{display:flex;flex-direction:column;gap:4px;letter-spacing:.15em}.brand strong{font-size:18px}.brand small{color:var(--muted);font-size:9px;letter-spacing:.3em}.kicker{color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{margin:10px 0 14px;font-size:30px;line-height:1.15}p{margin:0;color:var(--muted);font-size:14px;line-height:1.65}.actions{display:flex;gap:10px;margin-top:28px}button,a{min-height:46px;display:inline-flex;align-items:center;justify-content:center;padding:12px 17px;border-radius:6px;font-weight:750;text-decoration:none}button{border:0;background:var(--accent);color:var(--accent-dark);cursor:pointer}button:disabled{opacity:.55;cursor:wait}a{border:1px solid var(--line);color:var(--text)}.status{min-height:24px;margin-top:18px;color:var(--accent);font-size:12px}.status.error{color:#ef9c8d}@media(max-width:520px){main{padding:28px 22px}.actions{display:grid}h1{font-size:27px}}
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="/assets/brand/loki-symbol.png" alt=""><span><strong>LOKI</strong><small>STUDIO</small></span></div>
    <span class="kicker">Privat arbeidsflate</span>
    <h1>Du er invitert til Loki CRM</h1>
    <p>Godta invitasjonen for å aktivere kontoen din. Etterpå får du en engangskode på e-post når du logger inn.</p>
    <div class="actions"><button id="accept" type="button">Godta invitasjonen</button><a href="/crm-login.html">Til innlogging</a></div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </main>
  <script>
    const button=document.getElementById("accept");
    const status=document.getElementById("status");
    const token=new URLSearchParams(location.search).get("token")||"";
    if(!token){button.disabled=true;status.className="status error";status.textContent="Invitasjonslenken mangler eller er ugyldig."}
    button.addEventListener("click",async()=>{
      button.disabled=true;status.className="status";status.textContent="Aktiverer tilgangen …";
      try{
        const response=await fetch("/api/studio?action=access&accessAction=accept",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({token})});
        const data=await response.json();
        if(!response.ok)throw new Error(data.error);
        status.textContent="Tilgangen er aktiv. Sender deg til innlogging …";
        setTimeout(()=>location.replace(`/crm-login.html?email=${encodeURIComponent(data.email)}&invited=1`),700);
      }catch(error){button.disabled=false;status.className="status error";status.textContent=error.message||"Invitasjonen kunne ikke aktiveres."}
    });
  </script>
</body>
</html>

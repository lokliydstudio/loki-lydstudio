<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Loki Lydstudio · Privat lyttelenke</title>
  <style>
    :root{--ink:#1c1c1a;--muted:#77736a;--paper:#f3f0e8;--panel:#fffefa;--lime:#d9ff53;--line:#ded9cf}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}main{width:min(680px,100%);overflow:hidden;border:1px solid var(--line);border-radius:20px;background:var(--panel);box-shadow:0 30px 90px rgba(31,29,23,.12)}header{display:flex;align-items:center;gap:14px;padding:25px 28px;border-bottom:1px solid var(--line);background:#20201e;color:white}.logo{position:relative;width:62px;height:49px;overflow:hidden}.logo img{position:absolute;width:143px;height:143px;left:-40px;top:-47px;filter:brightness(0) invert(1)}.wordmark{display:flex;flex-direction:column;line-height:1;letter-spacing:.13em}.wordmark strong{font-size:16px}.wordmark span{margin-top:6px;color:#aaa79f;font-size:8px;letter-spacing:.28em}.content{padding:38px}.kicker{color:#5a584f;font-size:8px;font-weight:800;letter-spacing:.18em}h1{margin:9px 0 8px;font:500 34px Georgia,serif}.project{color:var(--muted);font-size:12px}.version{display:inline-block;margin:18px 0 22px;padding:6px 9px;border-radius:99px;background:var(--lime);font-size:9px;font-weight:800}audio{width:100%;margin:4px 0 18px}.notes{min-height:48px;margin:0;padding:15px;border-left:3px solid var(--lime);background:#f0ede6;color:#5f5b53;font-size:11px;line-height:1.6}.meta{display:flex;justify-content:space-between;gap:20px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:9px}.error{display:none;padding:22px;border-radius:10px;background:#fff0ed;color:#963c2e;font-size:12px;line-height:1.55}.privacy{margin:20px 0 0;color:#8a867e;font-size:9px;line-height:1.5}@media(max-width:560px){.content{padding:28px 22px}h1{font-size:28px}.meta{flex-direction:column;gap:7px}}
  </style>
</head>
<body>
  <main>
    <header><span class="logo"><img src="/assets/brand/loki-symbol.png" alt=""></span><span class="wordmark"><strong>LOKI</strong><span>LYDSTUDIO</span></span></header>
    <section class="content">
      <div id="loading"><span class="kicker">PRIVAT LYDLEVERANSE</span><h1>Åpner miksen …</h1><p class="project">Kontrollerer den sikre lenken.</p></div>
      <div id="player" hidden>
        <span class="kicker">PRIVAT LYDLEVERANSE</span>
        <h1 id="track-title"></h1>
        <p class="project" id="project-name"></p>
        <span class="version" id="track-version"></span>
        <audio id="audio" controls preload="metadata">Nettleseren støtter ikke lydavspilling.</audio>
        <p class="notes" id="track-notes"></p>
        <div class="meta"><span id="file-meta"></span><span id="expires"></span></div>
        <p class="privacy">Lenken er personlig og tidsbegrenset. Del den bare med personer som skal høre leveransen.</p>
      </div>
      <div class="error" id="error"></div>
    </section>
  </main>
  <script>
    const token = new URLSearchParams(location.search).get("token") || "";
    const formatBytes = bytes => `${(Number(bytes || 0) / 1024 / 1024).toLocaleString("nb-NO", { maximumFractionDigits: 1 })} MB`;
    (async () => {
      try {
        if (!token) throw new Error("Denne lyttelenken mangler en sikker nøkkel.");
        const response = await fetch(`/api/audio/share?token=${encodeURIComponent(token)}`, { credentials: "omit" });
        const responseText = await response.text();
        let data = {};
        try { data = JSON.parse(responseText); } catch {}
        if (!response.ok) throw new Error(data.error || "Lydleveransen kunne ikke åpnes.");
        document.getElementById("track-title").textContent = data.track.title;
        document.getElementById("project-name").textContent = data.track.projectName;
        document.getElementById("track-version").textContent = data.track.version;
        document.getElementById("track-notes").textContent = data.track.notes || "Lytt gjennom leveransen og send tilbakemeldingen din til post@lokilyd.no.";
        document.getElementById("file-meta").textContent = `${data.track.filename} · ${formatBytes(data.track.size)}`;
        document.getElementById("expires").textContent = `Gyldig til ${new Date(data.expiresAt).toLocaleDateString("nb-NO")}`;
        document.getElementById("audio").src = `/api/audio/stream?token=${encodeURIComponent(token)}`;
        document.getElementById("loading").hidden = true;
        document.getElementById("player").hidden = false;
      } catch (error) {
        document.getElementById("loading").hidden = true;
        const node = document.getElementById("error");
        node.textContent = error.message || "Lenken er ugyldig eller utløpt.";
        node.style.display = "block";
      }
    })();
  </script>
</body>
</html>

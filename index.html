<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loki Lydstudio</title>
  <meta name="description" content="Loki Lydstudio – innspilling, miks, master, produksjon." />
  <link rel="icon" href="assets/Loki_kunlogo_ubakgrunn.png" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<header class="header">
  <div class="container header__inner">
    <div class="brand">
      <img class="brand__logo" src="assets/Loki_kunlogo_ubakgrunn.png" alt="Loki Lydstudio logo" />
      <span class="brand__name">Loki Lydstudio</span>
    </div>
    <nav class="nav">
      <a href="#tjenester">Tjenester</a>
      <a href="#kontakt">Kontakt</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="container">
    <h1>Rent. Presist. Musikalsk.</h1>
    <p>Innspilling, miks, master og produksjon.</p>
    <a class="btn" href="#kontakt">Send forespørsel</a>
  </div>
</section>

<section id="tjenester" class="section">
  <div class="container grid">
    <div class="card"><h3>Innspilling</h3></div>
    <div class="card"><h3>Miks</h3></div>
    <div class="card"><h3>Master</h3></div>
    <div class="card"><h3>Produksjon</h3></div>
  </div>
</section>

<section id="kontakt" class="section">
  <div class="container">
    <h2>Kontakt</h2>
    <form action="https://formspree.io/f/REPLACE_ME" method="POST">
      <input type="text" name="name" placeholder="Navn" required>
      <input type="email" name="email" placeholder="Din e-post" required>
      <select name="service" required>
        <option value="">Velg tjeneste</option>
        <option>Innspilling</option>
        <option>Miks</option>
        <option>Master</option>
        <option>Produksjon</option>
        <option>Annet</option>
      </select>
      <input type="text" name="referral" placeholder="Hvor hørte du om oss?" required>
      <textarea name="message" placeholder="Melding" required></textarea>
      <button type="submit" class="btn">Send</button>
    </form>
    <p>E-post: <a href="mailto:post@lokilyd.no">post@lokilyd.no</a></p>
    <p>Instagram: @lokilydstudio</p>
    <p>Facebook: @lokilyd</p>
  </div>
</section>

<footer class="footer">
  <div class="container">
    © 2026 Loki Lydstudio
  </div>
</footer>
</body>
</html>

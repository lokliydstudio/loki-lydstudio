name: LokiCRM
options:
  bundleIdPrefix: no.lokilyd
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 8DH23LDJDY
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  LokiCRM:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Loki CRM
        CFBundleURLTypes:
          - CFBundleURLSchemes: [lokicrm]
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        LSApplicationQueriesSchemes: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.lokilyd.crm
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: App/LokiCRMDebug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: App/LokiCRMRelease.entitlements
    dependencies:
      - target: LokiCRMWidget
        embed: true
  LokiCRMWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Loki Gjøreliste
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.lokilyd.crm.widget
        CODE_SIGN_ENTITLEMENTS: Widget/LokiCRMWidget.entitlements
        SKIP_INSTALL: YES

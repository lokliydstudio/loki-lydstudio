<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Takk for bestillingen | LOKI LYDSTUDIO</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="templatemo-parallax-starter.css">
    <style>
        body { background: #080808; color: #fff; }
        .thanks-section {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 120px 20px;
            text-align: center;
            background-image: linear-gradient(rgba(0,0,0,.72), rgba(0,0,0,.82)), url('images/parallax-bg-05.jpg');
            background-position: center;
            background-size: cover;
        }
        .thanks-box {
            max-width: 760px;
            padding: 42px;
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.18);
            border-radius: 18px;
            backdrop-filter: blur(12px);
        }
        .thanks-box p { color: rgba(255,255,255,.8); line-height: 1.65; }
        .thanks-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 14px; margin-top: 26px; }
        .thanks-button {
            border: 1px solid rgba(255,255,255,.85);
            border-radius: 999px;
            padding: 12px 20px;
            color: #fff;
            text-decoration: none;
            font-family: 'Oswald', sans-serif;
            letter-spacing: .08em;
            text-transform: uppercase;
        }
        .thanks-button:hover { background: #fff; color: #000; }
    </style>
</head>
<body>
    <nav id="templatemo-nav">
        <div class="nav-container">
            <a href="index.html#home" class="nav-logo">
                <img src="images/logosmall.png" alt="Loki Lydstudio Logo" class="nav-logo-img">
            </a>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html#home">HJEM</a></li>
                <li><a href="nettbutikk.html">NETTBUTIKK</a></li>
                <li><a href="index.html#contact">KONTAKT</a></li>
            </ul>
        </div>
    </nav>

    <main class="thanks-section">
        <section class="thanks-box">
            <h1 class="section-title hero-title">TAKK FOR BESTILLINGEN</h1>
            <p>Betalingen er registrert. Vi tar kontakt med deg så snart som mulig for å avtale videre detaljer rundt prosjektet.</p>
            <p>Du får kvittering på e-post fra betalingsleverandøren dersom dette er aktivert i Stripe-kontoen.</p>
            <div class="thanks-actions">
                <a class="thanks-button" href="index.html#home">Til forsiden</a>
                <a class="thanks-button" href="nettbutikk.html">Til nettbutikk</a>
            </div>
        </section>
    </main>

    <script src="templatemo-parallax-script.js"></script>
</body>
</html>

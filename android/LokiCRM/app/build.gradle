plugins {
    id 'com.android.application'
}

android {
    namespace 'no.lokilyd.crm'
    compileSdk 36

    defaultConfig {
        applicationId 'no.lokilyd.crm'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:5.3.0'
}

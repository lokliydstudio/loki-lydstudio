<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sikker innlogging til Loki Lydstudio">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Loki Studio · Intern innlogging</title>
  <style>
    :root{--ink:#191918;--lime:#d9ff53;--panel:#242420;--line:#42413b}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;padding:22px;background:#191918;color:#fff;font-family:Arial,Helvetica,sans-serif}main{width:min(440px,100%);padding:38px;border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:0 30px 90px rgba(0,0,0,.45)}.brand{display:flex;align-items:center;gap:14px;margin-bottom:36px}.mark{width:36px;height:36px;display:grid;place-items:center;border:2px solid var(--lime);color:var(--lime);font-weight:900;transform:rotate(45deg)}.brand-copy{display:flex;flex-direction:column;line-height:.95;letter-spacing:.12em}.brand-copy strong{font-size:18px}.brand-copy span{margin-top:7px;color:#8e8b84;font-size:9px;letter-spacing:.28em}.kicker{color:var(--lime);font-size:9px;font-weight:800;letter-spacing:.18em}h1{margin:9px 0 12px;font:500 30px Georgia,serif}p{margin:0 0 24px;color:#b9b6ae;font-size:12px;line-height:1.6}form{display:grid;gap:11px}label{color:#a8a49b;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}input{width:100%;padding:14px;border:1px solid #55534c;border-radius:9px;background:#171716;color:#fff;font:inherit;font-size:13px}input:focus{outline:3px solid rgba(217,255,83,.2);border-color:var(--lime)}button{margin-top:5px;padding:13px 18px;border:0;border-radius:9px;background:var(--lime);color:var(--ink);font:800 12px Arial,sans-serif;cursor:pointer;box-shadow:0 3px 0 #b9d938}button:disabled{opacity:.6;cursor:wait}.feedback{min-height:34px;margin-top:16px;color:var(--lime);font-size:11px;line-height:1.5}.privacy{margin:18px 0 0;padding-top:16px;border-top:1px solid #393833;color:#85827b;font-size:9px}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark">L</span><span class="brand-copy"><strong>LOKI</strong><span>STUDIO</span></span></div>
    <span class="kicker">INTERN ARBEIDSFLATE</span>
    <h1>Logg inn med e-post</h1>
    <p>Be om en engangslenke til din godkjente @lokilyd.no-adresse. Lenken er gyldig i 15 minutter.</p>
    <form id="login-form">
      <label for="email">E-postadresse</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="navn@lokilyd.no" required>
      <button type="submit">Send sikker innloggingslenke</button>
    </form>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <p class="privacy">CRM-innholdet leveres ikke før en gyldig, signert økt er bekreftet på serveren.</p>
  </main>
  <script>
    const form = document.getElementById("login-form");
    const feedback = document.getElementById("feedback");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = form.querySelector("button");
      button.disabled = true;
      feedback.textContent = "Sender sikker lenke …";
      try {
        const response = await fetch("/api/crm/auth-request", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ email: new FormData(form).get("email") }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error);
        feedback.textContent = "Hvis adressen er godkjent, er innloggingslenken sendt. Sjekk innboksen.";
        form.reset();
      } catch (error) {
        feedback.textContent = error.message || "Kunne ikke sende innloggingslenken.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
